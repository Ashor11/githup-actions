name: Ahsour 
on: push
jobs:
    build:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                image: [ubuntu-20.04, ubuntu-22.04, ubuntu-23.04]

        runs-on: ${{ matrix.os }}
        steps:
             - name: Checkout code
               run: echo "Hello World"
             - name: Set up Docker Buildx
               uses: docker/setup-buildx-action@v2
             - name: echo docker version
               run: docker --version
             - name: run image
               run: docker run ${ matrix.image } echo "Hello World"
