name: Ahsour 
on: push
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
             - name: docker setup
               uses: docker/setup-buildx-action@v4

             - name: echo docker version
               run: docker --version

             - name: run image
               run: docker run alpine:latest echo "Hello World"
             - name: run image with args
               run: docker run alpine:latest echo "Hello World" --name my_container -d -p 8080:80
